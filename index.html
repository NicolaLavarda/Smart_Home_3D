<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartHome 3D" />
    <title>Smart Home 3D - Digital Twin & Spatial CV Engine</title>
    <link rel="icon" type="image/svg+xml" href="/pwa/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 3D Canvas Layer -->
      <div id="canvas-container"></div>
      
      <!-- CSS2D HTML Overlay Layer -->
      <div id="css2d-container"></div>

      <!-- User Interface Layer -->
      <div class="ui-layer">
        <!-- Top Navigation Bar -->
        <header class="top-bar" id="top-bar"></header>

        <!-- Right Side Device Modal / Drawer -->
        <aside class="modal-drawer glass" id="device-modal-drawer"></aside>

        <!-- Bottom Timeline & Replay Scrubber -->
        <footer class="timeline-bar glass" id="timeline-container"></footer>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
