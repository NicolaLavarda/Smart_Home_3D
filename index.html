<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartHome 3D" />
    <title>Smart Home 3D - Digital Twin & Spatial CV Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/svg+xml" href="/pwa/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 3D Canvas Layer -->
      <div id="canvas-container"></div>
      
      <!-- CSS2D HTML Overlay Layer -->
      <div id="css2d-container"></div>

      <!-- User Interface Layer -->
      <div class="ui-layer">
        <!-- Top Navigation Bar -->
        <header class="top-bar" id="top-bar"></header>

        <!-- Right Side Device Modal / Drawer -->
        <aside class="modal-drawer glass" id="device-modal-drawer"></aside>

        <!-- Bottom-Left Security FAB & Multi-Camera / History Hub -->
        <div class="security-hub-root" id="security-hub-root"></div>

        <!-- Bottom-Right Navigation & Device Control FAB Hub -->
        <div class="nav-hub-root" id="nav-hub-root"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
