<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 200" width="512" height="200">
  <defs>
    <linearGradient id="disney-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Curved arc -->
  <path d="M 40 160 C 90 40, 320 20, 420 85" fill="none" stroke="url(#disney-arc)" stroke-width="9" stroke-linecap="round"/>
  <!-- Disney text in iconic font -->
  <text x="35" y="145" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="108" fill="#FFFFFF" letter-spacing="-2">Disney</text>
  <!-- Plus symbol with glow -->
  <text x="395" y="140" font-family="'Inter', sans-serif" font-weight="900" font-size="110" fill="#38bdf8">+</text>
</svg>

